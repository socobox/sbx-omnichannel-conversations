name: Publish to npm

# Runs on every push to main that touches package.json, and can also be fired by hand
# (workflow_dispatch) — e.g. to publish a version that was merged before this automation existed.
# Idempotent: if package.json's version is already on npm, the publish/release steps are skipped
# rather than failing, so an unrelated push that happens to touch package.json (formatting, a
# dependency bump with no version change) is a safe no-op.
on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
      # npm Trusted Publishing (OIDC) needs npm >=11.5.1 — newer than what some Node 24 patch
      # builds bundle. setup-node@v6 handles the actual OIDC handshake (via `id-token: write`
      # above) as long as the npm binary itself understands the protocol.
      - run: npm install -g npm@latest
      - run: bun install
      - run: bun run build
      - run: bun test

      # A prerelease version (anything with a "-", e.g. 0.3.0-beta.0) publishes under its own
      # prerelease identifier as the npm dist-tag (0.3.0-beta.0 -> "beta", 1.0.0-rc.1 -> "rc")
      # instead of "latest" — `npm install` (unpinned) must never silently pick up a beta. A
      # plain version (1.2.3) publishes as "latest", npm's own default when --tag is omitted.
      - name: Check version and determine dist-tag
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "sbx-omnichannel-conversations@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=$(echo "$VERSION" | sed -E 's/^[^-]+-([A-Za-z]+).*/\1/')" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing (OIDC) — configured 2026-09-21 on npm's package settings (GitHub
      # Actions, socobox/sbx-omnichannel-conversations, publish.yml). No NODE_AUTH_TOKEN/NPM_TOKEN
      # needed: npm's CLI exchanges the `id-token: write` OIDC token above for a short-lived
      # publish credential itself. This replaced the classic automation token after npm started
      # requiring it go through a manual `npm stage publish` + 2FA approval instead of publishing
      # directly (https://github.blog/changelog/2026-07-31-restricting-npm-bypass-2fa-granular-access-tokens/).
      - name: Publish to npm
        if: steps.check.outputs.already_published == 'false'
        run: npm publish --provenance --access public --tag "${{ steps.check.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check.outputs.already_published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--title "v${{ steps.check.outputs.version }}" --generate-notes)
          if [[ "${{ steps.check.outputs.prerelease }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "v${{ steps.check.outputs.version }}" "${ARGS[@]}"
